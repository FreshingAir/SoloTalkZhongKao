name: Windows Build (Nuitka + Inno)

# 触发方式：
#  - 手动运行（Actions → 本工作流 → Run workflow）
#  - 推送到 main 分支
#  - 推送 v* 标签（如 v0.5 即将发布，会额外创建 GitHub Release）
on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

permissions:
  contents: write   # 允许创建 GitHub Release

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # 依赖由下方“Install Python build & runtime deps”用 pip install 显式安装，
      # 因此这里不启用 setup-python 的 pip 缓存（它需要仓库里有 requirements 文件）。

      # Nuitka 会把编译缓存放在一起，缓存在 runner 之间复用，避免每次全量编译 C 代码
      # 注意必须用双引号，使 $env:LOCALAPPDATA 被 PowerShell 正常展开（单引号会写入字面量导致 WinError 267）
      - name: Nuitka cache dir
        shell: pwsh
        run: |
          Write-Output "NUITKA_CACHE_DIR=$env:LOCALAPPDATA\Nuitka" >> $env:GITHUB_ENV

      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-py${{ env.pythonLocation }}

      - name: Install Inno Setup (for installer)
        shell: pwsh
        run: choco install -y --no-progress innosetup

      - name: Install Python build & runtime deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade nuitka ordered-set zstandard imageio
          python -m pip install PyQt5 pyttsx3 sounddevice vosk pygame numpy scipy edge-tts

      # 入口文件名可能为中文（如“SoloTalk…测试版_v0.5..py”），统一复制为干净的 main.py
      - name: Ensure clean main.py entry
        shell: pwsh
        run: |
          if (-not (Test-Path 'main.py')) {
            $src = Get-ChildItem -Path . -Filter 'SoloTalk*.py' | Select-Object -First 1
            if (-not $src) { throw 'No SoloTalk*.py entry file found in repo.' }
            Copy-Item $src.FullName 'main.py'
          }
          Write-Host "Using entry: $((Resolve-Path 'main.py').Path)"

      # vosk 模型（约 40MB）不进仓库，构建时从官方源下载并解压，让应用自带语音自动评测
      - name: Download & extract Vosk English model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -OutFile 'vosk.zip' -UseBasicParsing
          Expand-Archive -Path 'vosk.zip' -DestinationPath . -Force
          Remove-Item 'vosk.zip'
          $mdl = 'vosk-model-small-en-us-0.15\am\final.mdl'
          if (-not (Test-Path $mdl)) { throw "Vosk model not extracted: $mdl" }
          Write-Host "[OK] Vosk model ready."

      - name: Verify build script files exist
        shell: pwsh
        run: |
          foreach ($f in 'installer.iss') {
            if (-not (Test-Path $f)) { throw "Missing required file: $f" }
          }

      # 显式启用 MSVC 工具链。windows-latest 已预装 VS Build Tools，
      # 这一步调用 vcvars 把 cl.exe / 环境注入到后续步骤，使 Nuitka 跨会话可见 MSVC。
      - name: Enable MSVC toolchain (vcvars)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 与本地 build_nuitka.bat 的参数保持一致，并在此基础上强制使用 MSVC 工具链
      - name: Compile with Nuitka (standalone, MSVC)
        shell: pwsh
        run: |
          $flags = @(
            '--standalone',
            '--enable-plugin=pyqt5',
            '--msvc=latest',              # 明确使用 Windows 运行器上预装的 MSVC，禁用其它工具链
            '--assume-yes-for-downloads', # 自动同意下载依赖分析工具(Dependency Walker)，避免 CI 非交互提示卡死
            '--windows-console-mode=disable',
            '--output-dir=build',
            '--include-package=vosk',
            '--include-package=pygame',
            '--include-package=sounddevice',
            '--include-package=edge_tts',
            '--include-package-data=edge_tts',
            '--include-package=scipy',
            '--include-package=numpy',
            '--include-data-dir=vosk-model-small-en-us-0.15=vosk-model-small-en-us-0.15',
            '--output-filename=SoloTalkZhongKao.exe',
            'main.py'
          )
          python -m nuitka @flags
          if (-not (Test-Path 'build\main.dist\SoloTalkZhongKao.exe')) {
            throw 'Nuitka did not produce build\main.dist\SoloTalkZhongKao.exe'
          }
          Write-Host "[OK] Exe built."

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after choco install.' }
          & $iscc 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = Get-ChildItem 'installer\*.exe' -ErrorAction Stop | Select-Object -First 1
          Write-Host "[OK] Installer: $($setup.FullName)"

      - name: Upload portable app folder (portable zip)
        uses: actions/upload-artifact@v4
        with:
          name: SoloTalk-portable
          path: build/main.dist
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SoloTalk-installer
          path: installer/*.exe
          if-no-files-found: error

      # 仅在推送 v* 标签时，把安装包作为 GitHub Release 资产发布
      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
          draft: true

  # 快速打包作业：PyInstaller 不重新编译 C 代码、只收集 Python 与 DLL 文件，
  # 比 Nuitka 快得多（产物体积更大）。适用于不希望等待长时间 C 编译的场景。
  build-windows-pyinstaller:
    name: Build via PyInstaller (fast)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Inno Setup (for installer)
        shell: pwsh
        run: choco install -y --no-progress innosetup

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5 pyttsx3 sounddevice vosk pygame numpy scipy edge-tts pyinstaller

      - name: Ensure clean main.py entry
        shell: pwsh
        run: |
          if (-not (Test-Path 'main.py')) {
            $src = Get-ChildItem -Path . -Filter 'SoloTalk*.py' | Select-Object -First 1
            if (-not $src) { throw 'No SoloTalk*.py entry file found in repo.' }
            Copy-Item $src.FullName 'main.py'
          }
          Write-Host "Using entry: $((Resolve-Path 'main.py').Path)"

      - name: Download & extract Vosk English model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip' -OutFile 'vosk.zip' -UseBasicParsing
          Expand-Archive -Path 'vosk.zip' -DestinationPath . -Force
          Remove-Item 'vosk.zip'
          if (-not (Test-Path 'vosk-model-small-en-us-0.15\am\final.mdl')) { throw 'Vosk model not extracted.' }
          Write-Host "[OK] Vosk model ready."

      - name: Build with PyInstaller (onedir)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name SoloTalkZhongKao `
            --distpath build_pyi --workpath build_pyi_work --specpath build_pyi_spec `
            --add-data "vosk-model-small-en-us-0.15;vosk-model-small-en-us-0.15" `
            --collect-all pyttsx3 `
            --collect-all pygame `
            --collect-all sounddevice `
            main.py
          if (-not (Test-Path 'build_pyi\SoloTalkZhongKao\SoloTalkZhongKao.exe')) {
            throw 'PyInstaller did not produce build_pyi\SoloTalkZhongKao\SoloTalkZhongKao.exe'
          }
          Write-Host "[OK] Exe built."

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after choco install.' }
          & $iscc "/DSrcDir=build_pyi\SoloTalkZhongKao" 'installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = Get-ChildItem 'installer\*.exe' -ErrorAction Stop | Select-Object -First 1
          Write-Host "[OK] Installer: $($setup.FullName)"

      - name: Upload portable app folder (PyInstaller)
        uses: actions/upload-artifact@v4
        with:
          name: SoloTalk-portable-pyi
          path: build_pyi/SoloTalkZhongKao
          if-no-files-found: error

      - name: Upload installer (PyInstaller)
        uses: actions/upload-artifact@v4
        with:
          name: SoloTalk-installer-pyi
          path: installer/*.exe
          if-no-files-found: error